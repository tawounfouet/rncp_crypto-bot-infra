apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crypto-bot-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitlab.com/dst_crypto/crypto-bot-infra.git
    targetRevision: main
    path: overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
