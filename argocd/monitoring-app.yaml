apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1 : Helm chart loki-stack (Loki + Promtail + Grafana)
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki-stack
      targetRevision: 2.10.3
      helm:
        valuesObject:
          loki:
            persistence:
              enabled: true
              storageClassName: local-path
              size: 5Gi
          grafana:
            enabled: true
            admin:
              existingSecret: grafana-admin
              userKey: admin-user
              passwordKey: admin-password
            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
            # Plugin JSON generique pour interroger /health (version, statut)
            # sur les 5 environnements, K8s comme VM AWS.
            plugins:
              - yesoreyeram-infinity-datasource
            datasources:
              infinity-datasource.yaml:
                apiVersion: 1
                datasources:
                  - name: Infinity
                    type: yesoreyeram-infinity-datasource
                    access: proxy
                    isDefault: false
            # HTTP_PROXY route les appels sortants de Grafana (dont ceux
            # d'Infinity vers la VM AWS, 100.100.226.42) via tailscale-proxy.
            # NO_PROXY exclut tout ce qui est deja joignable en direct
            # in-cluster (Loki/Prometheus/K8s services), pour ne pas les
            # faire transiter inutilement par le proxy.
            env:
              HTTP_PROXY: "http://tailscale-proxy.monitoring.svc.cluster.local:1055"
              NO_PROXY: "localhost,127.0.0.1,.svc,.svc.cluster.local,.cluster.local,10.0.0.0/8"
          promtail:
            enabled: true
            config:
              clients:
                - url: http://monitoring-loki:3100/loki/api/v1/push
              # Deux labels ajoutes pour un dashboard Grafana unifie K8s + VM AWS
              # (cf. docs/MONITORING.md) :
              # - source : symetrique a source=vm-aws sur les logs de la VM,
              #   pour filtrer par origine independamment de l'environnement.
              # - environment : recopie le namespace K8s (namespace est deja
              #   pose par les relabel_configs par defaut du chart avant que
              #   celui-ci ne s'execute) sous le meme nom de label que celui
              #   utilise par Promtail sur la VM (environment=staging/production)
              #   -- meme concept, meme label des deux cotes, un seul jeu de
              #   panels/variables suffit au lieu d'un doublon par origine.
              #   Restreint aux 3 namespaces applicatifs : sans le regex, tous
              #   les namespaces infra (argocd, kube-system, ingress-nginx, ...)
              #   se retrouveraient aussi dans le variable "environment" cote
              #   Grafana -- si le namespace ne matche pas, Promtail laisse le
              #   label absent (comportement standard des relabel_configs).
              snippets:
                extraRelabelConfigs:
                  - target_label: source
                    replacement: k8s-proxmox
                  - source_labels: [namespace]
                    regex: '(dev|staging|production)'
                    target_label: environment
                    replacement: '$1'
            tolerations:
              - effect: NoSchedule
                key: node-role.kubernetes.io/master
                operator: Exists
              - effect: NoSchedule
                key: node-role.kubernetes.io/control-plane
                operator: Exists
          # Metriques (CPU/RAM/pods/nodes) pour dev+staging+production, en plus
          # des logs Loki deja en place. Le sous-chart "prometheus" (bundle
          # dans loki-stack) fournit prometheus-server + node-exporter (RAM/CPU
          # hote par node Talos) + kube-state-metrics (etat des pods/deploiements).
          # Le datasource Grafana "Prometheus" est cree automatiquement par le
          # sidecar datasources (grafana.sidecar.datasources.enabled, deja true
          # par defaut dans ce chart) des que prometheus.enabled=true.
          prometheus:
            enabled: true
            server:
              persistentVolume:
                storageClassName: local-path
                size: 8Gi
              retention: "15d"
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
            extraScrapeConfigs: |
              - job_name: node_exporter
                # proxy_url : les pods K8s n'ont pas d'interface Tailscale, on
                # sort via le pod tailscale-proxy (cf. monitoring/tailscale-proxy.yaml)
                # qui, lui, est un vrai membre du tailnet.
                proxy_url: http://tailscale-proxy.monitoring.svc.cluster.local:1055
                static_configs:
                  - targets: ["100.100.226.42:9100"]

              - job_name: blackbox
                metrics_path: /probe
                params:
                  module: [http_2xx] # Look for a HTTP 200 response.
                static_configs:
                  - targets:
                    - http://100.100.226.42:8009/health # check app staging
                    - http://100.100.226.42:8010/health # check app prod
                relabel_configs:
                  - source_labels: [__address__]
                    target_label: __param_target
                  - source_labels: [__param_target]
                    target_label: instance
                  - target_label: __address__
                    replacement: monitoring-prometheus-blackbox-exporter:9115  # The blackbox exporter's real hostname:port.
                
            # Alerting non necessaire pour un dashboard de suivi -- economise
            # de la RAM (contrainte connue sur ce cluster, cf. incident 24/07).
            alertmanager:
              enabled: false
            prometheus-pushgateway:
              enabled: false
            kube-state-metrics:
              enabled: true
            prometheus-node-exporter:
              enabled: true
              tolerations:
                - effect: NoSchedule
                  key: node-role.kubernetes.io/master
                  operator: Exists
                - effect: NoSchedule
                  key: node-role.kubernetes.io/control-plane
                  operator: Exists
    # Source 2 : Extras depuis le repo Git (dashboards Grafana, etc.)
    - repoURL: https://gitlab.com/dst_crypto/crypto-bot-infra.git
      targetRevision: main
      path: monitoring
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      targetRevision: 11.17.2
      helm:
        valuesObject:
          config:
            modules:
              http_2xx:
                prober: http
                timeout: 5s
                http:
                  valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
                  follow_redirects: true
                  preferred_ip_protocol: "ip4"
                  # C'est ICI (pas dans le job Prometheus) que le proxy compte :
                  # c'est blackbox-exporter lui-meme qui appelle la VM, Prometheus
                  # ne fait qu'appeler blackbox-exporter (deja joignable in-cluster).
                  proxy_url: http://tailscale-proxy.monitoring.svc.cluster.local:1055
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
