apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    # Source 1 : Helm chart loki-stack (Loki + Promtail + Grafana)
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki-stack
      targetRevision: 2.10.3
      helm:
        valuesObject:
          loki:
            persistence:
              enabled: true
              storageClassName: local-path
              size: 5Gi
          grafana:
            enabled: true
            admin:
              existingSecret: grafana-admin
              userKey: admin-user
              passwordKey: admin-password
            sidecar:
              dashboards:
                enabled: true
                label: grafana_dashboard
          promtail:
            enabled: true
            config:
              clients:
                - url: http://monitoring-loki:3100/loki/api/v1/push
            tolerations:
              - effect: NoSchedule
                key: node-role.kubernetes.io/master
                operator: Exists
              - effect: NoSchedule
                key: node-role.kubernetes.io/control-plane
                operator: Exists
    # Source 2 : Extras depuis le repo Git (dashboards Grafana, etc.)
    - repoURL: https://gitlab.com/dst_crypto/crypto-bot-infra.git
      targetRevision: main
      path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/persistentVolumeClaimRetentionPolicy
        - /spec/volumeClaimTemplates
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
