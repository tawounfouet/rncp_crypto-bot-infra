apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-crypto-bot
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  crypto-bot.json: |
    {
      "editable": true,
      "schemaVersion": 39,
      "tags": ["crypto-bot", "loki"],
      "title": "Crypto-Bot Logs",
      "uid": "crypto-bot-logs",
      "version": 1,
      "time": { "from": "now-1h", "to": "now" },
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "loki",
            "label": "Datasource",
            "hide": 0,
            "includeAll": false,
            "multi": false
          },
          {
            "name": "namespace",
            "type": "query",
            "label": "Namespace",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "datasource": { "type": "loki", "uid": "${datasource}" },
            "query": { "label": "namespace", "type": 1 },
            "refresh": 2
          },
          {
            "name": "pod",
            "type": "query",
            "label": "Pod",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "datasource": { "type": "loki", "uid": "${datasource}" },
            "query": { "label": "pod", "stream": "{namespace=~\"$namespace\"}", "type": 1 },
            "refresh": 2
          },
          {
            "name": "container",
            "type": "query",
            "label": "Container",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "datasource": { "type": "loki", "uid": "${datasource}" },
            "query": { "label": "container", "stream": "{namespace=~\"$namespace\", pod=~\"$pod\"}", "type": 1 },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Log Volume par namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=~\"$namespace\"} [$__interval])) by (namespace)",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 80,
                "stacking": { "mode": "normal" }
              },
              "unit": "short"
            }
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["sum"] } }
        },
        {
          "id": 2,
          "title": "Erreurs et warnings",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "sum(count_over_time({namespace=~\"$namespace\"} |~ \"(?i)(error|exception|fatal|panic)\" [$__interval])) by (namespace)",
              "legendFormat": "errors — {{namespace}}",
              "refId": "A"
            },
            {
              "expr": "sum(count_over_time({namespace=~\"$namespace\"} |~ \"(?i)(warn)\" [$__interval])) by (namespace)",
              "legendFormat": "warnings — {{namespace}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": { "mode": "normal" }
              },
              "unit": "short"
            },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "errors.*" }, "properties": [{ "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } }] },
              { "matcher": { "id": "byRegexp", "options": "warnings.*" }, "properties": [{ "id": "color", "value": { "fixedColor": "orange", "mode": "fixed" } }] }
            ]
          },
          "options": { "tooltip": { "mode": "multi" }, "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["sum"] } }
        },
        {
          "id": 3,
          "title": "Logs",
          "type": "logs",
          "gridPos": { "h": 20, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "loki", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "{namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true,
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "dedupStrategy": "none"
          }
        }
      ]
    }
