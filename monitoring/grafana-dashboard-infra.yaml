apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-infra
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  crypto-bot-infra.json: |
    {
      "editable": true,
      "schemaVersion": 39,
      "tags": ["crypto-bot", "prometheus"],
      "title": "Crypto-Bot - Infra K8s (dev/staging/production)",
      "uid": "crypto-bot-infra",
      "version": 9,
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "refresh": "30s",
      "panels": [
        {
          "id": 21,
          "type": "row",
          "title": "VM AWS (fallback)",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "panels": []
        },
        {
          "id": 13,
          "type": "table",
          "title": "Staging (VM AWS)",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 1 },
          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "PD0067CAD9A63E081" },
          "targets": [
            {
              "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "PD0067CAD9A63E081" },
              "type": "json",
              "source": "url",
              "format": "table",
              "parser": "backend",
              "url": "http://100.100.226.42:8009/health",
              "url_options": { "method": "GET" },
              "root_selector": "",
              "json_options": { "root_is_not_array": true },
              "columns": [
                { "selector": "status", "text": "Statut", "type": "string" },
                { "selector": "version", "text": "Version", "type": "string" }
              ],
              "refId": "A"
            }
          ]
        },
        {
          "id": 14,
          "type": "table",
          "title": "Production (VM AWS)",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 1 },
          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "PD0067CAD9A63E081" },
          "targets": [
            {
              "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "PD0067CAD9A63E081" },
              "type": "json",
              "source": "url",
              "format": "table",
              "parser": "backend",
              "url": "http://100.100.226.42:8010/health",
              "url_options": { "method": "GET" },
              "root_selector": "",
              "json_options": { "root_is_not_array": true },
              "columns": [
                { "selector": "status", "text": "Statut", "type": "string" },
                { "selector": "version", "text": "Version", "type": "string" }
              ],
              "refId": "A"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "CPU VM AWS",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\", job=\"node_exporter\"}[5m]))",
              "legendFormat": "VM AWS Liora"
            }
          ]
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "RAM VM AWS",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "node_memory_MemAvailable_bytes{job=\"node_exporter\"}",
              "legendFormat": "disponible"
            },
            {
              "expr": "node_memory_MemTotal_bytes{job=\"node_exporter\"}",
              "legendFormat": "total"
            }
          ]
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "CPU par service (VM AWS)",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (name) (rate(container_cpu_usage_seconds_total{job=\"cadvisor_vm\", name!=\"\"}[5m]))",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "RAM par service (VM AWS)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{job=\"cadvisor_vm\", name!=\"\"}",
              "legendFormat": "{{name}}"
            }
          ]
        },
        {
          "id": 20,
          "type": "row",
          "title": "Kubernetes (Proxmox)",
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "panels": []
        },
        {
          "id": 10,
          "type": "table",
          "title": "Dev (K8s)",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "max by (annotation_deployed_commit) (kube_pod_annotations{namespace=\"dev\", pod=~\"crypto-bot-backend.*\", annotation_deployed_commit=~\".+\"}) OR label_replace(vector(1), \"annotation_deployed_commit\", \"non trackee (deploiement manuel)\", \"\", \".*\")",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Value": true },
                "renameByName": { "annotation_deployed_commit": "Version deployee" }
              }
            }
          ]
        },
        {
          "id": 11,
          "type": "table",
          "title": "Staging (K8s)",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "max by (annotation_deployed_commit) (kube_pod_annotations{namespace=\"staging\", pod=~\"crypto-bot-backend.*\", annotation_deployed_commit=~\".+\"})",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Value": true },
                "renameByName": { "annotation_deployed_commit": "Version deployee" }
              }
            }
          ]
        },
        {
          "id": 12,
          "type": "table",
          "title": "Production (K8s)",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "max by (annotation_deployed_commit) (kube_pod_annotations{namespace=\"production\", pod=~\"crypto-bot-backend.*\", annotation_deployed_commit=~\".+\"})",
              "instant": true,
              "format": "table",
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "labelsToFields", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "Value": true },
                "renameByName": { "annotation_deployed_commit": "Version deployee" }
              }
            }
          ]
        },
        {
          "id": 17,
          "type": "table",
          "title": "Utilisateurs",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 31 },
          "targets": [
            {
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "PCB356066F2DF6A17" },
              "rawSql": "SELECT 'dev' AS environnement, (SELECT count(*) FROM users) AS inscrits, (SELECT count(*) FROM user_sessions WHERE expires_at > now()) AS connectes",
              "format": "table",
              "refId": "A"
            },
            {
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "P850AA54EAD9D0173" },
              "rawSql": "SELECT 'staging' AS environnement, (SELECT count(*) FROM users) AS inscrits, (SELECT count(*) FROM user_sessions WHERE expires_at > now()) AS connectes",
              "format": "table",
              "refId": "B"
            },
            {
              "datasource": { "type": "grafana-postgresql-datasource", "uid": "PC1E65DDDC0CC8B33" },
              "rawSql": "SELECT 'production' AS environnement, (SELECT count(*) FROM users) AS inscrits, (SELECT count(*) FROM user_sessions WHERE expires_at > now()) AS connectes",
              "format": "table",
              "refId": "C"
            }
          ],
          "transformations": [
            { "id": "merge", "options": {} }
          ]
        },
        {
          "id": 1,
          "type": "table",
          "title": "Etat des services (replicas disponibles / souhaitees)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 37 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=~\"dev|staging|production\"}",
              "legendFormat": "{{namespace}} / {{deployment}}",
              "instant": true,
              "format": "table"
            },
            {
              "expr": "kube_deployment_spec_replicas{namespace=~\"dev|staging|production\"}",
              "legendFormat": "{{namespace}} / {{deployment}}",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true },
                "renameByName": {
                  "namespace": "Environnement",
                  "deployment": "Service",
                  "Value #A": "Disponibles",
                  "Value #B": "Souhaitees"
                }
              }
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU par pod (dev/staging/production)",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 45 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~\"dev|staging|production\", container!=\"\"}[5m]))",
              "legendFormat": "{{namespace}} / {{pod}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "RAM par pod (dev/staging/production)",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 45 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"dev|staging|production\", container!=\"\"})",
              "legendFormat": "{{namespace}} / {{pod}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "CPU des 3 noeuds Talos",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 54 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "expr": "1 - avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\", job=\"kubernetes-service-endpoints\"}[5m]))",
              "legendFormat": "{{node}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "RAM disponible des 3 noeuds Talos",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 54 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "expr": "node_memory_MemAvailable_bytes{job=\"kubernetes-service-endpoints\"}",
              "legendFormat": "{{node}} disponible"
            },
            {
              "expr": "node_memory_MemTotal_bytes{job=\"kubernetes-service-endpoints\"}",
              "legendFormat": "{{node}} total"
            }
          ]
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "label": "Datasource",
            "hide": 0,
            "includeAll": false,
            "multi": false
          }
        ]
      }
    }
