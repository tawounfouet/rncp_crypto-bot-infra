---
# Secrets (vault_vm_host / vault_ssh_user / vault_ssh_private_key_path) partages
# avec production dans ../../group_vars/vm_liora.yml (chiffre ansible-vault),
# via le groupe vm_liora ci-dessous. Ports/prefixe deja alignes sur
# docker-compose.staging.yml.
all:
  children:
    vm_liora:
      hosts:
        vm-liora:
          ansible_host: "{{ vault_vm_host }}"
          ansible_user: "{{ vault_ssh_user }}"
          ansible_ssh_private_key_file: "{{ vault_ssh_private_key_path }}"
