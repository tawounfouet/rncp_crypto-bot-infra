# =============================================================================
# CI crypto-bot-infra — Validation des manifests Kubernetes (GitOps)
#
# Valide, AVANT qu'ArgoCD ne synchronise, que les manifests Kustomize :
#   - se construisent (kustomize build des 3 overlays) ;
#   - sont conformes aux schémas Kubernetes (kubeconform).
# Empêche un manifest cassé d'atteindre le cluster.
# =============================================================================

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == null'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate

variables:
  # Versions épinglées des outils de validation (pas de 'latest' en CI)
  KUSTOMIZE_VERSION: "5.4.3"
  KUBECONFORM_VERSION: "0.7.0"

validate:manifests:
  stage: validate
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl bash tar
    - curl -sSLf "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
        | tar -xz -C /usr/local/bin kustomize
    - curl -sSLf "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
        | tar -xz -C /usr/local/bin kubeconform
    - kustomize version && kubeconform -v
  script:
    - ./scripts/verify.sh
