apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crypto-bot-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: crypto-bot.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: crypto-bot-backend
                port:
                  number: 8009
          - path: /health
            pathType: Exact
            backend:
              service:
                name: crypto-bot-backend
                port:
                  number: 8009
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crypto-bot-frontend
                port:
                  number: 8501
