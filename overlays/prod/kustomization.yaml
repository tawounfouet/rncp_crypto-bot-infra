apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base
  - ingress.yaml
  - secrets.yaml
  - network-policy.yaml

patches:
  - target:
      kind: Deployment
      name: crypto-bot-backend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: registry.gitlab.com/dst_crypto/crypto-bot-app/backend:v1.0.1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENVIRONMENT
          value: production
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DEBUG
          value: "false"
      - op: add
        path: /spec/template/metadata/annotations
        value:
          deployed-commit: "2ed04c09"

  - target:
      kind: Deployment
      name: crypto-bot-frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: registry.gitlab.com/dst_crypto/crypto-bot-app/frontend:v1.0.1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ENVIRONMENT
          value: production
      - op: add
        path: /spec/template/metadata/annotations
        value:
          deployed-commit: "2ed04c09"
