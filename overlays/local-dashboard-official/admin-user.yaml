# Compte admin pour le Kubernetes Dashboard officiel (namespace kubernetes-dashboard).
# Le Dashboard lui-meme est installe depuis le manifeste upstream v2.7.0
# (cf. scripts/local-dashboard-official-up.sh) ; ce fichier ajoute juste l'identite
# de connexion (token) avec les droits cluster-admin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin-user
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-user
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: admin-user
    namespace: kubernetes-dashboard
