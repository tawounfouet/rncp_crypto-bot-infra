# Token LONGUE DUREE pour se connecter au Dashboard officiel (pas d'expiration 1h
# comme "kubectl create token"). Genere par le controleur de tokens (annotation
# service-account.name) sur le ServiceAccount admin-user.
apiVersion: v1
kind: Secret
metadata:
  name: admin-user-token
  annotations:
    kubernetes.io/service-account.name: admin-user
type: kubernetes.io/service-account-token
