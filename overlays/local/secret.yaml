# Secret de developpement LOCAL (cluster Kind) -- valeurs jetables.
# Remplace le SealedSecret de overlays/dev (non dechiffrable sans le controleur
# sealed-secrets du cluster distant).
#
# ATTENTION : ne jamais reutiliser ces valeurs ailleurs qu'en local.
#
# Cles OBLIGATOIRES (sans defaut cote backend, cf.
# crypto-bot-app/backend/src/shared/config/settings.py) :
#   JWT_SIGNING_KEY, CORS_ORIGINS, ALLOWED_HOSTS
# Cles requises par les services socles :
#   POSTGRES_USER/PWD (postgres), MINIO_ACCESS_KEY/SECRET_KEY (minio + backend)
# Cles de parite avec overlays/dev/secrets.yaml (non utilisees par les 4 socles,
# conservees pour rester aligne sur l'infra) :
#   SECRET_KEY, EXCHANGE_ENC_KEY
apiVersion: v1
kind: Secret
metadata:
  name: crypto-bot-secrets
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PWD: "postgres"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  # Le backend n'a pas de valeur par defaut pour ces 3 variables (pydantic -> CrashLoop
  # sinon). ALLOWED_HOSTS DOIT contenir crypto-bot-backend : la livenessProbe envoie
  # "Host: crypto-bot-backend" (base/backend/deployment.yaml), sinon 400 -> CrashLoop.
  JWT_SIGNING_KEY: "dev-jwt-signing-key-not-for-production-0000000000"
  CORS_ORIGINS: "http://localhost:8511,http://crypto-bot-frontend:8501"
  ALLOWED_HOSTS: "localhost,127.0.0.1,crypto-bot-backend"
  SECRET_KEY: "dev-secret-key-not-for-production"
  # Fernet key 32 octets nuls (base64) -- placeholder valide, dev uniquement.
  EXCHANGE_ENC_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
