# Identifiants Grafana pour le monitoring LOCAL (Kind) -- valeurs jetables.
# Remplace le SealedSecret grafana-admin du cluster distant
# (monitoring/grafana-admin-sealed.yaml).
#
# Consomme par le chart kube-prometheus-stack via grafana.admin.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "admin"
