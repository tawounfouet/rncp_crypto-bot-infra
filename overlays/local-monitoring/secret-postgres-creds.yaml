# Identifiants PostgreSQL dev pour la datasource Grafana locale (monitoring).
# Meme pattern que le distant (secret grafana-postgres-creds), en clair.
# Aligne sur le secret crypto-bot-secrets du namespace dev.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-postgres-creds
type: Opaque
stringData:
  DEV_POSTGRES_USER: "postgres"
  DEV_POSTGRES_PWD: "postgres"
