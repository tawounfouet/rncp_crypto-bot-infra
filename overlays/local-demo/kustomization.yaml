# Overlay LOCAL-DEMO -- mode demonstration de soutenance (parite docker-compose.demo.yml).
#
#   kubectl apply -k overlays/local-demo      (ou ./scripts/local-demo-up.sh)
#
# Herite de overlays/local et ajoute au backend les variables qui rendent la demo
# deterministe (pas d'execution reelle / pas d'appel exchange) :
#   ENABLE_BACKGROUND_TASKS=0   -> worker de bots desactive
#   BOT_TEMPLATE_AUTO_MIGRATE=0 -> pas de migration automatique des templates au boot
# Les donnees affichees proviennent alors du seed (backend/scripts/seed_demo.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - ../local

patches:
  - target:
      kind: Deployment
      name: crypto-bot-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ENABLE_BACKGROUND_TASKS, value: "0" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: BOT_TEMPLATE_AUTO_MIGRATE, value: "0" }
      # Cles testnet Binance (optionnelles) injectees par local-demo-up.sh depuis
      # crypto-bot-app/.env (secret cree imperativement, jamais commite). Si le
      # secret est absent (optional: true), le seed retombe sur des cles factices.
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: binance-demo-creds
            optional: true
