# Airflow (webserver + scheduler + init) sur Kind -- equivalent des services
# airflow-* de crypto-bot-app/docker-compose.yml (ancre x-airflow-common).
# Image : orchestration/Dockerfile (deja construite) -> tag local "airflow:local".
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-config
data:
  AIRFLOW__CORE__EXECUTOR: "LocalExecutor"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
  # LocalExecutor execute les taches DANS le pod scheduler : sans limite, les DAGs
  # d'ingestion (beaucoup de taches, pandas/minio/binance) font exploser la RAM du
  # scheduler -> OOMKilled. On borne le parallelisme (dev local).
  AIRFLOW__CORE__PARALLELISM: "4"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
  AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_SECURE: "0"
  MINIO_BUCKET: "crypto-bot-data"
  BINANCE_BASE_URL: "https://api.binance.com"
  PYTHONPATH: "/opt/airflow"
---
# Initialisation : attend la base "airflow" (creee par le Job db-init), puis
# "airflow db init" + connection postgres_default + utilisateur admin.
apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-init
  labels:
    app: airflow-init
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: airflow-init
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-airflow-db
          image: postgres:14
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" >/dev/null 2>&1 &&
              psql -h postgres -U "$POSTGRES_USER" -d airflow -c 'SELECT 1' >/dev/null 2>&1;
              do echo "attente de la base airflow..."; sleep 3; done
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: POSTGRES_USER }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: POSTGRES_PWD }
      containers:
        - name: airflow-init
          image: airflow:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              airflow db init
              airflow connections delete postgres_default || true
              airflow connections add 'postgres_default' \
                --conn-type 'postgres' \
                --conn-host 'postgres' \
                --conn-port '5432' \
                --conn-login "$POSTGRES_USER" \
                --conn-password "$POSTGRES_PWD" \
                --conn-schema 'crypto_bot_db'
              airflow users create \
                --username "${AIRFLOW_ADMIN_USER:-admin}" \
                --firstname Crypto --lastname Admin \
                --role Admin \
                --email admin@cryptobot.local \
                --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" || true
              echo "Airflow initialise."
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: POSTGRES_PWD }
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: MINIO_ACCESS_KEY }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: MINIO_SECRET_KEY }
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PWD)@postgres:5432/airflow"
          envFrom:
            - configMapRef: { name: airflow-config }
            - secretRef: { name: airflow-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-webserver
  labels:
    app: airflow-webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-webserver
  template:
    metadata:
      labels:
        app: airflow-webserver
    spec:
      securityContext:
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: webserver
          image: airflow:local
          imagePullPolicy: IfNotPresent
          args: ["webserver"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: POSTGRES_PWD }
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: MINIO_ACCESS_KEY }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: MINIO_SECRET_KEY }
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PWD)@postgres:5432/airflow"
          envFrom:
            - configMapRef: { name: airflow-config }
            - secretRef: { name: airflow-secrets }
          volumeMounts:
            - name: airflow-logs
              mountPath: /opt/airflow/logs
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 2Gi }
      volumes:
        - name: airflow-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-webserver
spec:
  selector:
    app: airflow-webserver
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-scheduler
  labels:
    app: airflow-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: airflow-scheduler
  template:
    metadata:
      labels:
        app: airflow-scheduler
    spec:
      securityContext:
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: scheduler
          image: airflow:local
          imagePullPolicy: IfNotPresent
          args: ["scheduler"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: POSTGRES_USER }
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: POSTGRES_PWD }
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: MINIO_ACCESS_KEY }
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: crypto-bot-secrets, key: MINIO_SECRET_KEY }
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PWD)@postgres:5432/airflow"
          envFrom:
            - configMapRef: { name: airflow-config }
            - secretRef: { name: airflow-secrets }
          volumeMounts:
            - name: airflow-logs
              mountPath: /opt/airflow/logs
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 2Gi }
      volumes:
        - name: airflow-logs
          emptyDir: {}
